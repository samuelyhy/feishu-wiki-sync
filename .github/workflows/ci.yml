name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 只保留最新一次：连续推送时不必为中间那次跑完整个矩阵
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 声明的是 >=18。下限必须真的被跑过 ——
        # 否则「支持 Node 18」只是一句没人验证的声明。
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile：锁文件与 package.json 不一致时直接失败，
      # 而不是悄悄装出另一套依赖树
      - run: pnpm install --frozen-lockfile

      # test 的 pretest 会先构建，所以这里不必单独 build
      - run: pnpm test
        env:
          NO_COLOR: '1'

  # 发布前门禁单独跑一遍：它检查的是元数据是否齐备，
  # 与代码是否正确无关，失败原因也完全不同 —— 分开跑才好定位
  publish-readiness:
    name: 发布就绪检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-publish-ready.mjs
        continue-on-error: true # 未就绪不该让 CI 红；它是提醒，不是门禁
